seed: 42

models:
  separate: True
  policy:
    class: LidarLSTMGaussianMixin
    clip_actions: True
    clip_log_std: True
    min_log_std: -20.0
    max_log_std: 2.0
    initial_log_std: 0.0
    state_dim: 16
    lidar_dim: 90
    lidar_feature_dim: 512
    fuse_hidden_dims: [512, 256]
    rnn_hidden_size: 256
    rnn_num_layers: 1
    sequence_length: 16
    rnn_num_envs: 1
  value:
    class: LidarLSTMDeterministicMixin
    clip_actions: False
    state_dim: 16
    lidar_dim: 90
    lidar_feature_dim: 512
    fuse_hidden_dims: [512, 256]
    rnn_hidden_size: 256
    rnn_num_layers: 1
    sequence_length: 16
    rnn_num_envs: 1

memory:
  class: RandomMemory
  memory_size: -1

agent:
  class: PPO_RNN
  rollouts: 512
  learning_epochs: 8
  mini_batches: 16
  discount_factor: 0.99
  lambda: 0.98
  learning_rate: 1.0e-05
  learning_rate_scheduler: KLAdaptiveLR
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.01
  state_preprocessor: RunningStandardScaler
  state_preprocessor_kwargs: null
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 1.0
  ratio_clip: 0.12
  value_clip: 0.2
  clip_predicted_values: True
  entropy_loss_scale: 0.001
  value_loss_scale: 0.3
  kl_threshold: 0.0
  rewards_shaper_scale: 1.0
  time_limit_bootstrap: False
  experiment:
    directory: "lidar_short_nav_demo_multi_v1_bridge_lstm_direct"
    experiment_name: ""
    write_interval: auto
    checkpoint_interval: 6400

trainer:
  class: SequentialTrainer
  timesteps: 300000
  environment_info: log
