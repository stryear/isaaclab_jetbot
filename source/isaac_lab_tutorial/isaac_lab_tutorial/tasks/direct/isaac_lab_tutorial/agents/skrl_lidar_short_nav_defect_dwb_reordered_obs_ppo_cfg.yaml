seed: 42


# Same architecture as the DWB finetune config, but the input slices match the
# environment observation order: 13 scalar dims, 90 LiDAR beams, 3 scalar dims.
models:
  separate: False
  policy:
    class: GaussianMixin
    clip_actions: True
    clip_log_std: True
    min_log_std: -20.0
    max_log_std: 2.0
    initial_log_std: 0.0
    network:
      - name: lidar_net
        input: "STATES[:, 13:103].view(-1, 1, 90, 1)"
        layers:
          - conv2d: [16, [5, 1], [2, 1], 0]
          - conv2d: [32, [3, 1], [2, 1], 0]
          - flatten: {}
          - 256
        activations: [elu, elu, "", elu]
      - name: fuse
        input: "concatenate([lidar_net, STATES[:, :13], STATES[:, 103:106]])"
        layers: [256, 128]
        activations: elu
    output: ACTIONS
  value:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: lidar_net
        input: "STATES[:, 13:103].view(-1, 1, 90, 1)"
        layers:
          - conv2d: [16, [5, 1], [2, 1], 0]
          - conv2d: [32, [3, 1], [2, 1], 0]
          - flatten: {}
          - 256
        activations: [elu, elu, "", elu]
      - name: fuse
        input: "concatenate([lidar_net, STATES[:, :13], STATES[:, 103:106]])"
        layers: [256, 128]
        activations: elu
    output: ONE


memory:
  class: RandomMemory
  memory_size: -1


agent:
  class: PPO
  rollouts: 256
  learning_epochs: 6
  mini_batches: 16
  discount_factor: 0.99
  lambda: 0.95
  learning_rate: 1.5e-05
  learning_rate_scheduler: KLAdaptiveLR
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.008
  state_preprocessor: RunningStandardScaler
  state_preprocessor_kwargs: null
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 1.0
  ratio_clip: 0.10
  value_clip: 0.2
  clip_predicted_values: True
  entropy_loss_scale: 0.002
  value_loss_scale: 0.3
  kl_threshold: 0.0
  rewards_shaper_scale: 1.0
  time_limit_bootstrap: False
  experiment:
    directory: "lidar_short_nav_defect_dwb_reordered_obs_direct"
    experiment_name: ""
    write_interval: auto
    checkpoint_interval: 1600


trainer:
  class: SequentialTrainer
  timesteps: 10000000
  environment_info: log
